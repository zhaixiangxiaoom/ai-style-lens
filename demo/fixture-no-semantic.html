<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>StyleLens 回归夹具 — 无语义标签页</title>
<style>
:root {
  --brand: oklch(0.6 0.2 250);      /* 现代色函数，应转 hex */
  --bg-soft: lab(96% 0 0);          /* lab，应转 hex */
  --font-stack: Inter, system-ui;   /* 非颜色变量，必须被过滤 */
  --surface: var(--bg-soft);        /* var() 引用颜色，应解析后保留 */
}
* { margin: 0; box-sizing: border-box; }
body { background: #fff; font-family: Inter, system-ui, sans-serif; padding: 40px; }
.wrap { max-width: 720px; margin: 0 auto; }
.title { font-size: 32px; font-weight: 700; margin-bottom: 16px; }
.text { font-size: 16px; line-height: 1.6; margin-bottom: 16px; }
.card {
  padding: 24px;
  border-radius: 12px;
  margin-bottom: 16px;
  /* 前四层为全透明占位（Tailwind 噪声），应被剥离 */
  box-shadow: rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,0.08) 0px 4px 24px 0px;
}
.row { display: flex; gap: 8px; padding: 8px 0; }
.btn { border-radius: 9999px; padding: 8px 16px; background: #18181b; color: #fff; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">无语义标签页面</div>
  <div class="text">整页由 div/span 构建，用于回归字体层级推断与现代颜色函数转换。</div>
  <div class="card">
    <div class="text">卡片内容文本</div>
    <div class="row"><span class="btn">按钮一</span><span class="btn">按钮二</span></div>
  </div>
  <div class="card"><div class="text">另一张卡片</div></div>
</div>
</body>
</html>
